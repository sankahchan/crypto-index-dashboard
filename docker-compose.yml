services:
  app:
    build: .
    image: crypto-index-dashboard:latest
    container_name: crypto-index-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data

volumes:
  app-data:
